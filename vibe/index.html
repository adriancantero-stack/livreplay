  <style>
    :root {
      --bg-dark: #000000;
      --vibe-color: #8a2be2; /* Roxo */
      --text-main: #ffffff;
      --text-muted: #b3b3b3;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body, html {
      width: 100vw;
      height: 100dvh;
      background-color: var(--bg-dark);
      color: var(--text-main);
      overflow: hidden; /* O feed que vai rolar, não o body */
      touch-action: pan-y; /* Prevent pinch zoom, allow vertical scroll */
    }

    /* Top Navigation / Chips */
    .top-nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 100;
      background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
      padding: env(safe-area-inset-top, 20px) 0 20px 0;
    }
    .nav-header {
      display: flex;
      align-items: center;
      padding: 0 20px;
      margin-bottom: 15px;
    }
    .back-btn {
      color: white;
      text-decoration: none;
      font-size: 24px;
      margin-right: 15px;
    }
    .nav-header h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .nav-header h1 span {
      color: var(--vibe-color);
    }

    .chips-container {
      display: flex;
      overflow-x: auto;
      padding: 0 20px;
      gap: 10px;
      scrollbar-width: none;
    }
    .chips-container::-webkit-scrollbar {
      display: none;
    }
    .chip {
      background: rgba(255,255,255,0.15);
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.2s;
      border: 1px solid transparent;
    }
    .chip.active {
      background: var(--vibe-color);
      box-shadow: 0 0 15px rgba(138, 43, 226, 0.4);
    }

    /* Feed Container */
    .feed-container {
      height: 100dvh;
      width: 100%;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scroll-behavior: smooth;
      scrollbar-width: none; /* Firefox */
    }
    .feed-container::-webkit-scrollbar {
      display: none; /* Chrome */
    }

    /* Card / Slide */
    .vibe-card {
      scroll-snap-align: start;
      height: 100vh;
      width: 100%;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-size: cover;
      background-position: center;
      overflow: hidden;
    }
    
    /* Overlay escuro e blur pro fundo */
    .vibe-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: inherit;
      filter: blur(20px) brightness(0.4);
      transform: scale(1.1);
      z-index: 1;
    }

    /* Gradient overlay for bottom */
    .vibe-card::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 50%;
      background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
      z-index: 2;
    }

    .album-art-center {
      position: relative;
      z-index: 3;
      width: 280px;
      height: 280px;
      border-radius: 12px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
      margin-top: -60px;
      margin-bottom: 20px;
      background-size: cover;
      background-position: center;
    }

    .card-content {
      position: absolute;
      bottom: 40px;
      left: 0;
      width: 100%;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      z-index: 3;
    }

    .song-info {
      flex: 1;
      padding-right: 20px;
    }
    .song-title {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 5px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }
    .song-artist {
      font-size: 16px;
      color: var(--text-muted);
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .listen-full-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--vibe-color);
      color: white;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(138, 43, 226, 0.4);
      transition: transform 0.2s;
    }
    .listen-full-btn:active {
      transform: scale(0.95);
    }

    /* Right Sidebar Buttons */
    .action-sidebar {
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
      padding-bottom: 10px;
    }
    .action-btn {
      background: transparent;
      border: none;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      cursor: pointer;
    }
    .action-icon {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .action-btn:active .action-icon {
      background: rgba(255,255,255,0.3);
      transform: scale(0.85);
    }
    
    /* Toast de Compartilhamento */
    .toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--vibe-color);
      color: white;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: bold;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s;
      z-index: 9999;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    .action-label {
      font-size: 12px;
      font-weight: 500;
      text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    }

    /* Progress Bar for 30s limit */
    .progress-bar-container {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: rgba(255,255,255,0.2);
      z-index: 10;
    }
    .progress-fill {
      height: 100%;
      background: #FFFFFF;
      width: 0%;
      transition: width 0.1s linear;
    }

    /* Autoplay Block Overlay */
    #autoplay-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    #autoplay-overlay.active {
      opacity: 1;
      pointer-events: auto;
      cursor: pointer;
    }
    .overlay-play-btn {
      width: 80px;
      height: 80px;
      background: var(--vibe-color);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 0 40px rgba(138, 43, 226, 0.4);
      animation: pulse 2s infinite;
    }
    .overlay-play-btn svg {
      width: 40px;
      height: 40px;
      fill: white;
      margin-left: 5px;
    }
    .overlay-text {
      font-size: 20px;
      font-weight: 600;
      color: white;
    }
    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(138, 43, 226, 0.7); }
      70% { transform: scale(1.05); box-shadow: 0 0 0 20px rgba(138, 43, 226, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(138, 43, 226, 0); }
    }

    /* Loading Overlay */
    #loading-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: var(--bg-dark);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      transition: opacity 0.3s;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 4px solid rgba(255,255,255,0.1);
      border-top-color: var(--vibe-color);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    
    /* Search Modal */
    .search-modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(10px);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .search-modal {
      background: var(--bg-dark);
      padding: 30px;
      border-radius: 20px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 10px 40px rgba(138, 43, 226, 0.3);
      transform: translateY(20px);
      transition: transform 0.3s;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .search-modal.active {
      transform: translateY(0);
    }
    .search-modal h3 {
      font-size: 24px;
      margin-bottom: 10px;
    }
    .search-modal p {
      color: var(--text-muted);
      margin-bottom: 20px;
      font-size: 14px;
    }
    .vibe-input {
      width: 100%;
      padding: 15px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 10px;
      color: white;
      font-size: 16px;
      margin-bottom: 20px;
      outline: none;
    }
    .vibe-input:focus {
      border-color: var(--vibe-color);
    }
    .vibe-search-btn {
      width: 100%;
      padding: 15px;
      background: var(--vibe-color);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    .close-modal-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Loading State -->
  <div id="loading-overlay">
    <div class="spinner"></div>
    <h3>Sintonizando a Vibe...</h3>
  </div>

  <div id="autoplay-overlay" onclick="startBlockedAudio()">
    <div class="overlay-play-btn">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </div>
    <div class="overlay-text">Toque para entrar na Vibe</div>
  </div>

  <!-- Top Navigation -->
  <div class="top-nav">
    <div class="nav-header">
      <a href="../" class="back-btn">←</a>
      <h1>LivrePlay <span>Vibe</span></h1>
    </div>
    <div class="chips-container" id="chips-container">
      <!-- Chips will be generated here -->
    </div>
  </div>

  <!-- Feed Vertical -->
  <div class="feed-container" id="feed-container">
    <!-- Cards will be generated here -->
  </div>

  <!-- Hidden Audio Element -->
  <audio id="vibe-player" style="display:none;" preload="auto"></audio>

  <!-- Search Modal -->
  <div class="search-modal-overlay" id="searchModalOverlay">
    <div class="search-modal" id="searchModal">
      <button class="close-modal-btn" onclick="closeSearchModal()">✕</button>
      <h3>Qual é a sua Vibe?</h3>
      <p>Digite qualquer coisa (ex: "Churrasco", "Rock 80s", "Chorar no banho") e nós criamos o feed.</p>
      <input type="text" class="vibe-input" id="vibeInput" placeholder="Sua vibe..." autocomplete="off">
      <button class="vibe-search-btn" onclick="executeCustomVibe()">Surpreenda-me</button>
    </div>
  </div>

  <script>
    // Configurações e Categorias
    const VIBES = [
      { id: 'buscar', label: '🔍 Buscar', isAction: true, action: 'openSearch' },
      { id: 'tophits', label: '🔥 Top Hits', query: 'top hits popular' },
      { id: 'foco', label: 'Foco', query: 'lofi beats focus' },
      { id: 'treino', label: 'Treino', query: 'workout gym music' },
      { id: 'relax', label: 'Relax', query: 'relaxing acoustic' },
      { id: 'gospel', label: 'Gospel', query: 'gospel worship' },
      { id: 'lofi', label: 'Lo-fi', query: 'lofi chill' },
      { id: 'funk', label: 'Funk', query: 'funk brasileiro' },
      { id: 'sertanejo', label: 'Sertanejo', query: 'sertanejo universitario' },
      { id: 'eletronica', label: 'Eletrônica', query: 'electronic dance music' },
      { id: 'surpresa', label: '🎲 Surpreenda-me', isAction: true, action: 'randomSurprise' }
    ];

    const SURPRISE_THEMES = [
      "japanese jazz", "80s synth pop", "epic movie soundtracks", "celtic folk",
      "90s hip hop", "brazilian bossa nova", "cyberpunk darksynth", "reggae chill",
      "classical piano solos", "heavy metal workout", "indie folk", "latin reggaeton",
      "kpop hits", "vintage blues", "french accordion", "arabic trap",
      "mariachi", "cumbia", "viking music", "meditation healing"
    ];

    let activeVibe = VIBES[1]; // Começa no Top Hits (agora índice 1)
    let poolTracks = []; // Armazena as 200 músicas do iTunes
    let currentTracks = []; // Músicas atualmente renderizadas na tela
    let observer = null;
    let activeCardIndex = -1;
    let isLoadingMore = false;

    const feedContainer = document.getElementById('feed-container');
    const chipsContainer = document.getElementById('chips-container');
    const audioPlayer = document.getElementById('vibe-player');
    const loadingOverlay = document.getElementById('loading-overlay');
    const searchModal = document.getElementById('searchModalOverlay');
    const vibeInput = document.getElementById('vibeInput');

    // Inicialização
    function init() {
      renderChips();
      loadVibe(activeVibe);
      setupIntersectionObserver();
      setupAudioPlayer();
    }

    function renderChips() {
      chipsContainer.innerHTML = '';
      VIBES.forEach(vibe => {
        const chip = document.createElement('div');
        chip.className = `chip ${vibe.id === activeVibe.id ? 'active' : ''}`;
        chip.textContent = vibe.label;
        chip.onclick = () => {
          if (vibe.isAction) {
            if (vibe.action === 'openSearch') openSearchModal();
            if (vibe.action === 'randomSurprise') executeSurprise();
            return;
          }
          document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
          chip.classList.add('active');
          activeVibe = vibe;
          loadVibe(activeVibe);
        };
        chipsContainer.appendChild(chip);
      });
    }

    // Modal Actions
    function openSearchModal() {
      searchModal.style.display = 'flex';
      setTimeout(() => searchModal.style.opacity = '1', 10);
      vibeInput.focus();
    }
    
    function closeSearchModal() {
      searchModal.style.opacity = '0';
      setTimeout(() => searchModal.style.display = 'none', 300);
    }
    
    function executeCustomVibe() {
      const val = vibeInput.value.trim();
      if(val) {
        closeSearchModal();
        document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        activeVibe = { id: 'custom', label: `"${val}"`, query: val };
        
        // Adiciona um chip temporário na interface
        const tempChip = document.createElement('div');
        tempChip.className = 'chip active';
        tempChip.textContent = activeVibe.label;
        chipsContainer.insertBefore(tempChip, chipsContainer.children[3]);
        
        loadVibe(activeVibe);
      }
    }
    
    vibeInput.addEventListener('keypress', (e) => {
      if(e.key === 'Enter') executeCustomVibe();
    });

    function executeSurprise() {
      const randomQuery = SURPRISE_THEMES[Math.floor(Math.random() * SURPRISE_THEMES.length)];
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      activeVibe = { id: 'surprise', label: '🎲 Surpresa', query: randomQuery };
      
      const tempChip = document.createElement('div');
      tempChip.className = 'chip active';
      tempChip.textContent = activeVibe.label;
      chipsContainer.insertBefore(tempChip, chipsContainer.children[3]);
      
      loadVibe(activeVibe);
    }

    async function fetchiTunesTracks(query) {
      // O iTunes ignora o parâmetro offset. A solução é puxar o máximo de músicas (200) e paginar localmente.
      const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&entity=song&limit=200`);
      if (!res.ok) throw new Error('iTunes API Error');
      const data = await res.json();
      const validTracks = data.results.filter(item => item.previewUrl); 
      return shuffleArray(validTracks);
    }
    
    // Embaralha as músicas (Fisher-Yates) para nunca repetir a mesma ordem
    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    async function loadVibe(vibe) {
      loadingOverlay.style.opacity = '1';
      loadingOverlay.style.pointerEvents = 'all';
      feedContainer.innerHTML = '';
      feedContainer.scrollTop = 0; // Reseta o scroll para o topo
      audioPlayer.pause();
      poolTracks = [];
      currentTracks = [];
      isLoadingMore = false;
      activeCardIndex = -1; // Força o reset do card ativo
      
      try {
        poolTracks = await fetchiTunesTracks(vibe.query);
        currentTracks = poolTracks.slice(0, 25); // Pega as primeiras 25
        
        if (currentTracks.length > 0) {
          renderFeed(currentTracks, 0);
          
          // Força tocar a primeira música instantaneamente após renderizar
          setTimeout(() => {
            const firstCard = document.querySelector('.vibe-card[data-index="0"]');
            if (firstCard) {
              // Inicia a primeira música usando os dados da primeira track
              playTrackPreview(
                currentTracks[0].previewUrl, 
                0, 
                currentTracks[0].trackName, 
                currentTracks[0].artistName, 
                currentTracks[0].artworkUrl100 ? currentTracks[0].artworkUrl100.replace('100x100bb', '600x600bb') : ''
              );
            }
          }, 300); // pequeno delay para garantir que a DOM atualizou
        } else {
          feedContainer.innerHTML = '<div style="color:white; text-align:center; padding-top:40vh; font-size:18px;">Nenhuma música encontrada para esta Vibe.</div>';
        }
      } catch (err) {
        console.error('Erro ao buscar Vibe no iTunes:', err);
        feedContainer.innerHTML = '<div style="color:white; text-align:center; padding-top:40vh; font-size:18px;">Erro ao conectar. Tente novamente.</div>';
      }

      setTimeout(() => {
        loadingOverlay.style.opacity = '0';
        loadingOverlay.style.pointerEvents = 'none';
      }, 300);
    }
    
    async function loadMoreVibe() {
      if (isLoadingMore) return;
      isLoadingMore = true;
      
      try {
        let nextBatch = poolTracks.slice(currentTracks.length, currentTracks.length + 25);
        
        // Se já mostramos todas as 200 músicas, re-embaralhamos o pool e começamos de novo (Infinito Real)
        if (nextBatch.length === 0 && poolTracks.length > 0) {
          poolTracks = shuffleArray([...poolTracks]);
          nextBatch = poolTracks.slice(0, 25);
        }

        if (nextBatch.length > 0) {
          const startIndex = currentTracks.length;
          currentTracks = currentTracks.concat(nextBatch);
          renderFeed(nextBatch, startIndex);
        }
      } catch (e) {
        console.error("Erro ao carregar mais vibes:", e);
      }
      isLoadingMore = false;
    }

    function renderFeed(tracksToRender, startIndex) {
      tracksToRender.forEach((track, idx) => {
        const index = startIndex + idx;
        const card = document.createElement('div');
        card.className = 'vibe-card';
        card.dataset.index = index;
        card.dataset.preview = track.previewUrl;
        card.dataset.trackName = track.trackName;
        card.dataset.artistName = track.artistName;
        
        // Alta resolução da capa (de 100x100 para 600x600)
        let highResThumb = track.artworkUrl100 ? track.artworkUrl100.replace('100x100bb', '600x600bb') : '';
        card.dataset.artwork = highResThumb;
        
        card.style.backgroundImage = `url('${highResThumb}')`;

        card.innerHTML = `
          <div class="album-art-center" style="background-image: url('${highResThumb}')"></div>
          <div class="card-content">
            <div class="song-info">
              <h2 class="song-title">${track.trackName}</h2>
              <div class="song-artist">🎵 ${track.artistName}</div>
              <a href="../music/?q=${encodeURIComponent(track.trackName + ' ' + track.artistName)}" class="listen-full-btn" onclick="if(window.posthog)posthog.capture('vibe_listen_full', {track: '${track.trackName.replace(/'/g, "\\'")}'})">
                ▶ Ouvir Completo
              </a>
            </div>
            <div class="action-sidebar">
              <button class="action-btn" onclick="toggleLike(this, '${track.trackName.replace(/'/g, "\\'")}')">
                <div class="action-icon">🤍</div>
                <span class="action-label">Curtir</span>
              </button>
              <button class="action-btn" onclick="shareTrack('${track.trackName.replace(/'/g, "\\'")}', '${track.artistName.replace(/'/g, "\\'")}')">
                <div class="action-icon">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg">
                    <path d="M21.08 11.23l-9-7A1 1 0 0 0 10 5v4c-6.84 0-8 6.07-8 11.83 0 .7.83 1.08 1.34.61 1.77-1.63 4.44-3.44 6.66-3.44V21a1 1 0 0 0 1.61.78l9-7a1 1 0 0 0 .47-1.55z"/>
                  </svg>
                </div>
                <span class="action-label">Share</span>
              </button>
            </div>
          </div>
          <div class="progress-bar-container">
            <div class="progress-fill" id="progress-${index}"></div>
          </div>
        `;
        feedContainer.appendChild(card);
        if (observer) observer.observe(card);
      });
    }

    function toggleLike(btn, trackName) {
      const icon = btn.querySelector('.action-icon');
      if (icon.textContent === '🤍') {
        icon.textContent = '❤️';
        icon.style.color = '#ff3b30';
        icon.style.transform = 'scale(1.3)';
        setTimeout(() => icon.style.transform = 'scale(1)', 200);
        showToast('Música curtida! ❤️');
      } else {
        icon.textContent = '🤍';
        icon.style.color = 'white';
      }
    }

    async function shareTrack(trackName, artistName) {
      // Cria a URL absoluta de forma segura apontando para a raiz do domínio
      const shareUrl = window.location.origin + '/music/?q=' + encodeURIComponent(trackName + ' ' + artistName);
      const shareData = {
        title: `LivrePlay: ${trackName}`,
        url: shareUrl
      };

      try {
        if (navigator.share) {
          await navigator.share(shareData);
        } else {
          // Copia apenas o URL para não quebrar a barra de navegação se o usuário colar
          await navigator.clipboard.writeText(shareUrl);
          showToast('Link copiado para a área de transferência! 🔗');
        }
      } catch (err) {
        console.error('Erro ao compartilhar:', err);
      }
    }

    function showToast(msg) {
      let toast = document.getElementById('vibeToast');
      if (!toast) {
        toast = document.createElement('div');
        toast.id = 'vibeToast';
        toast.className = 'toast';
        document.body.appendChild(toast);
      }
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toast._timeout);
      toast._timeout = setTimeout(() => toast.classList.remove('show'), 2500);
    }

    function setupIntersectionObserver() {
      const options = {
        root: feedContainer,
        rootMargin: '0px',
        threshold: 0.6
      };

      observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const index = parseInt(entry.target.dataset.index);
            const previewUrl = entry.target.dataset.preview;
            const trackName = entry.target.dataset.trackName;
            const artistName = entry.target.dataset.artistName;
            const artworkUrl = entry.target.dataset.artwork;
            
            // Lógica do Motor Infinito (dispara 5 cartas antes do fim)
            if (index >= currentTracks.length - 5) {
              loadMoreVibe();
            }
            
            if (activeCardIndex !== index) {
              activeCardIndex = index;
              playTrackPreview(previewUrl, index, trackName, artistName, artworkUrl);
            }
          }
        });
      }, options);
    }

    async function playTrackPreview(previewUrl, index, trackName, artistName, artworkUrl) {
      audioPlayer.pause();
      audioPlayer.currentTime = 0;
      resetAllProgress();

      try {
        audioPlayer.src = previewUrl;
        await audioPlayer.play();
        if (window.posthog) posthog.capture('vibe_play', { track: trackName });

        // Atualiza a Tela Bloqueada do iPhone/Android com MediaSession API
        if ('mediaSession' in navigator) {
          // Garantir URLs absolutas para imagens (obrigatório no iOS)
          const absoluteArtwork = artworkUrl ? artworkUrl : (window.location.origin + '/logo-vibe.png');
          
          navigator.mediaSession.metadata = new MediaMetadata({
            title: trackName ? String(trackName) : 'LivrePlay Vibe',
            artist: artistName ? String(artistName) : 'Descubra Novas Músicas',
            album: 'LivrePlay Vibe',
            artwork: [
              { src: absoluteArtwork, sizes: '512x512', type: 'image/png' },
              { src: absoluteArtwork, sizes: '512x512', type: 'image/jpeg' }
            ]
          });
          
          // Controles da tela de bloqueio
          navigator.mediaSession.setActionHandler('play', () => audioPlayer.play());
          navigator.mediaSession.setActionHandler('pause', () => audioPlayer.pause());
          navigator.mediaSession.setActionHandler('nexttrack', () => scrollToNextCard());
          navigator.mediaSession.setActionHandler('previoustrack', null);
        }
      } catch (e) {
        console.error('Erro ao tocar preview:', e);
        if (e.name === 'NotAllowedError') {
          document.getElementById('autoplay-overlay').classList.add('active');
        }
      }
    }

    async function startBlockedAudio() {
      document.getElementById('autoplay-overlay').classList.remove('active');
      try {
        await audioPlayer.play();
      } catch(e) {
        console.error('Ainda não foi possível iniciar o áudio', e);
      }
    }

    function setupAudioPlayer() {
      audioPlayer.addEventListener('timeupdate', () => {
        if (activeCardIndex >= 0) {
          const progressEl = document.getElementById(`progress-${activeCardIndex}`);
          const playedTime = audioPlayer.currentTime;
          
          if (progressEl) {
            const percent = (playedTime / 30) * 100;
            progressEl.style.width = `${Math.min(percent, 100)}%`;
          }

          if (playedTime >= 29.5 || audioPlayer.ended) {
            audioPlayer.pause();
            scrollToNextCard();
          }
        }
      });
      
      audioPlayer.addEventListener('ended', () => {
         scrollToNextCard();
      });
    }

    function resetAllProgress() {
      document.querySelectorAll('.progress-fill').forEach(el => el.style.width = '0%');
    }

    function scrollToNextCard() {
      const nextIndex = activeCardIndex + 1;
      const nextCard = document.querySelector(`.vibe-card[data-index="${nextIndex}"]`);
      if (nextCard) {
        // Extrair dados IMEDIATAMENTE para tentar dar play síncrono com o evento
        const previewUrl = nextCard.dataset.preview;
        const trackName = nextCard.dataset.trackName;
        const artistName = nextCard.dataset.artistName;
        const artworkUrl = nextCard.dataset.artwork;

        // Se a tela estiver bloqueada ou em background, o IntersectionObserver pode falhar ou atrasar.
        // E manipulação de DOM (scroll) atrasa o áudio bloqueando a permissão do iOS.
        if (document.hidden) {
           activeCardIndex = nextIndex;
           playTrackPreview(previewUrl, nextIndex, trackName, artistName, artworkUrl);
           // Rola a tela sutilmente sem smooth em background para não gastar processamento
           nextCard.scrollIntoView();
        } else {
           nextCard.scrollIntoView({ behavior: 'smooth' });
        }
        
        if (nextIndex >= currentTracks.length - 5) {
          loadMoreVibe();
        }
      } else {
        loadMoreVibe();
      }
    }

    init();
  </script>
</body>
