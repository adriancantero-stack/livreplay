<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>LivrePlay Flow - Tinder do Conhecimento</title>
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="../apple-touch-icon.jpg">

  <style>
    :root {
      --bg-dark: #050505;
      --accent: #ff8c00; /* Laranja Flow */
      --text: #ffffff;
      --text-muted: #888888;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden; 
    }

    .flow-container {
      height: 100vh;
      width: 100vw;
      overflow-y: scroll;
      -webkit-overflow-scrolling: touch;
      scroll-snap-type: y mandatory;
      scroll-behavior: smooth;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .flow-container::-webkit-scrollbar {
      display: none;
    }

    /* Barra de Progresso do Auto-Scroll */
    .progress-bar-container {
      position: absolute;
      bottom: 0; left: 0; width: 100%; height: 4px;
      background: rgba(255,255,255,0.1);
      z-index: 50;
    }
    .progress-bar {
      height: 100%; width: 0%;
      background: var(--accent);
      transition: width 0.1s linear;
    }

    /* Barra Superior Fixa */
    .top-nav {
      position: fixed;
      top: 0; left: 0; width: 100%;
      z-index: 100;
      background: linear-gradient(to bottom, rgba(5,5,5,0.9) 0%, rgba(5,5,5,0) 100%);
      padding: calc(env(safe-area-inset-top, 0px) + 20px) 20px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
    }
    .top-nav > * { pointer-events: auto; }

    .back-btn {
      color: #fff;
      text-decoration: none;
      font-size: 24px;
      font-weight: bold;
      background: rgba(255,255,255,0.05);
      width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
      transition: background 0.2s;
    }
    .back-btn:active { background: rgba(255,255,255,0.15); }

    .logo-text {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .logo-text span { color: var(--accent); }

    .sound-btn {
      background: rgba(255, 140, 0, 0.2);
      border: 1px solid var(--accent);
      color: var(--accent);
      width: 40px; height: 40px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.2s;
    }
    .sound-btn:active { transform: scale(0.9); }
    .sound-btn svg { width: 20px; height: 20px; }

    /* Cada Card de Conhecimento */
    .knowledge-card {
      height: 100vh;
      width: 100vw;
      scroll-snap-align: start;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 40px;
      background: radial-gradient(circle at center, #111111 0%, #050505 100%);
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .topic-badge {
      align-self: flex-start;
      background: rgba(255, 140, 0, 0.1);
      color: var(--accent);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 24px;
      border: 1px solid rgba(255, 140, 0, 0.3);
      animation: fadeIn 1s ease-out;
    }

    .quote-text {
      font-size: 28px;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 30px;
      letter-spacing: -0.5px;
      color: #f4f4f5;
      text-wrap: balance;
      animation: slideUpFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
      transform: translateY(20px);
    }
    
    .quote-text strong {
      color: var(--accent);
    }

    .author-text {
      font-size: 16px;
      color: var(--text-muted);
      font-weight: 500;
      margin-bottom: 40px;
      opacity: 0;
      animation: fadeIn 1s 0.5s forwards;
    }

    .deep-dive-btn {
      align-self: center;
      background: linear-gradient(135deg, var(--accent), #ff5e00);
      color: #fff;
      border: none;
      padding: 18px 40px;
      border-radius: 30px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(255, 140, 0, 0.3);
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      align-items: center;
      gap: 12px;
      opacity: 0;
      animation: slideUpFade 0.8s 0.3s forwards;
    }
    .deep-dive-btn:active {
      transform: scale(0.95);
      box-shadow: 0 5px 15px rgba(255, 140, 0, 0.4);
    }
    .deep-dive-btn svg {
      width: 24px; height: 24px;
    }

    .swipe-indicator {
      position: absolute;
      bottom: calc(env(safe-area-inset-bottom, 20px) + 30px);
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      color: rgba(255,255,255,0.4);
      animation: bounce 2s infinite;
      pointer-events: none;
      z-index: 50;
    }
    .swipe-indicator span {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-top: 5px;
      font-weight: 600;
    }

    @keyframes slideUpFade {
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      to { opacity: 1; }
    }
    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% { transform: translate(-50%, 0); }
      40% { transform: translate(-50%, -10px); }
      60% { transform: translate(-50%, -5px); }
    }

    /* Padrão visual de fundo */
    .bg-pattern {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 30px 30px;
      pointer-events: none;
      z-index: 0;
    }
    .content-wrapper {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      height: 100%;
      justify-content: center;
    }

  </style>
  <script>
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
    document.addEventListener('gesturechange', function (e) { e.preventDefault(); });
    document.addEventListener('gestureend', function (e) { e.preventDefault(); });
    document.addEventListener('touchmove', function (e) {
      if (e.touches && e.touches.length > 1) { e.preventDefault(); }
    }, { passive: false });
  </script>
  <script src="cards.js"></script>
</head>

ICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgIA=";


    const bgPlaylist = [
      "../assets/bg1.mp3",
      "../assets/bg2.mp3",
      "../assets/bg3.mp3",
      "../assets/bg4.mp3"
    ];
    let currentTrackIndex = 0;

    function stripHtml(html) {
      let tmp = document.createElement("DIV");
      tmp.innerHTML = html;
      return tmp.textContent || tmp.innerText || "";
    }

    function toggleSound() {
      isSoundOn = !isSoundOn;
      document.getElementById('icon-muted').style.display = isSoundOn ? 'none' : 'block';
      document.getElementById('icon-sound').style.display = isSoundOn ? 'block' : 'none';
      
      const bgMusic = document.getElementById('bgMusic');
      bgMusic.volume = 0.1;

      if (isSoundOn) {
        if (!bgMusic.src || bgMusic.src === "" || bgMusic.src === window.location.href) {
          bgMusic.src = bgPlaylist[currentTrackIndex];
        }
        bgMusic.play().catch(e => console.log("Music play blocked:", e));
        if(feedCards[currentCardIndex]) readCard(currentCardIndex);
      } else {
        bgMusic.pause();
        const voicePlayer = document.getElementById('voicePlayer');
        if(voicePlayer) {
           voicePlayer.pause();
           voicePlayer.src = "";
        }
        audioState = 'idle';
        clearAutoScroll();
      }
    }

    function clearAutoScroll() {
      clearInterval(progressBarInterval);
      const activeBars = document.querySelectorAll('.progress-bar');
      activeBars.forEach(bar => bar.style.width = '0%');
      progressValue = 0;
    }

    function pausePlayback() {
      if (!isPaused) {
         isPaused = true;
         document.getElementById('bgMusic').pause();
         document.getElementById('voicePlayer').pause();
         document.querySelectorAll('.progress-bar').forEach(p => p.style.transition = 'none');
      }
    }

    function resumePlayback() {
      if (isPaused) {
         isPaused = false;
         if (isSoundOn) {
            document.getElementById('bgMusic').play().catch(e=>{});
            document.getElementById('voicePlayer').play().catch(e=>{});
         }
      }
      if (progressValue > 0 && progressValue < TOTAL_SCROLL_TIME) {
         startProgressBar(feedCards[currentCardIndex]);
      }
    }

    function startProgressBar(cardElement) {
        if(!cardElement) return;
        const progressBar = cardElement.querySelector('.progress-bar');
        const interval = 50;
        let lastTime = Date.now();

        progressBarInterval = setInterval(() => {
          if(isPaused) {
            lastTime = Date.now();
            return;
          }
          const now = Date.now();
          const delta = now - lastTime;
          lastTime = now;
          progressValue += delta;
          if(progressBar) progressBar.style.width = `${(progressValue/TOTAL_SCROLL_TIME)*100}%`;
          
          if (progressValue >= TOTAL_SCROLL_TIME) {
            clearInterval(progressBarInterval);
            progressValue = 0;
            
            // Fallback: se o áudio não tocar ou for bloqueado, forçamos o scroll
            if (audioState !== 'pausing' && audioState !== 'idle') {
                audioState = 'idle';
                isAutoScrolling = true;
                currentCardIndex++;
                if (currentCardIndex >= feedCards.length - 2) appendCards(5);
                const nextCard = feedCards[currentCardIndex];
                if (nextCard) {
                    nextCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    readCard(currentCardIndex);
                }
                setTimeout(() => { isAutoScrolling = false; }, 1000);
            }
          }
        }, interval);
    }

    function readCard(index) {
      clearAutoScroll();
      if (!isSoundOn || isPaused) return;
      const cardElement = feedCards[index];
      if (!cardElement) return;

      const audioId = cardElement.getAttribute('data-audio');
      if (!audioId) return;

      audioState = 'reading';
      const voicePlayer = document.getElementById('voicePlayer');
      voicePlayer.src = `${AUDIO_BASE_URL}/${audioId}`;
      voicePlayer.play().catch(e => {
         console.log("Voice play error:", e);
         // Fallback se bloquear (provavelmente iOS ignorando play automático fora de evento)
         startProgressBar(cardElement);
      });
    }

    function setupAudioStateMachine() {
        const voicePlayer = document.getElementById('voicePlayer');
        if(!voicePlayer) return;
        voicePlayer.onended = () => {
            if (isPaused) return;
            if (audioState === 'reading') {
                audioState = 'pausing';
                voicePlayer.src = SILENCE_B64;
                voicePlayer.play().catch(e=>{});
                startProgressBar(feedCards[currentCardIndex]);
            } else if (audioState === 'pausing') {
                audioState = 'idle';
                isAutoScrolling = true;
                currentCardIndex++;
                if (currentCardIndex >= feedCards.length - 2) appendCards(5);
      setupAudioStateMachine();
                const nextCard = feedCards[currentCardIndex];
                if (nextCard) {
                    nextCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    readCard(currentCardIndex);
                }
                setTimeout(() => { isAutoScrolling = false; }, 1000);
            }
        };
    }

    function appendCards(count) {
      const container = document.getElementById('flowContainer');
      
      // Lógica de "Baralho": Só repete um card quando todos os KNOWLEDGE_CARDS forem mostrados
      if (globalDeck.length < count) {
        globalDeck = globalDeck.concat(shuffleArray(KNOWLEDGE_CARDS));
      }
      const newCards = globalDeck.splice(0, count);

      newCards.forEach(card => {
         const isFirst = feedCards.length === 0;
         const wrapper = document.createElement('div');
         wrapper.innerHTML = createCardHTML(card, isFirst);
         const cardEl = wrapper.firstElementChild;
         container.appendChild(cardEl);
         feedCards.push(cardEl);
         if(observer) observer.observe(cardEl);
       });
    }

    function initObserver() {
      const options = {
        root: document.getElementById('flowContainer'),
        rootMargin: '0px',
        threshold: 0.6
      };

      observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            if (isAutoScrolling) return; // Ignore observer during auto-scroll to avoid double voices
            const index = feedCards.indexOf(entry.target);
            currentCardIndex = index;
            readCard(index);

            if (index >= feedCards.length - 2) {
              appendCards(5);
            }
          }
        });
      }, options);

      feedCards.forEach(card => observer.observe(card));
    }

    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function createCardHTML(cardData, isFirst) {
      const cleanQuote = stripHtml(cardData.quote);
      const color = TOPIC_COLORS[cardData.topic] || { bg: "#111111", badge: "var(--accent)", rgb: "255, 140, 0" };
      return `
        <div class="knowledge-card" data-audio="${cardData.audioId}" data-quote="${cleanQuote}" style="background: radial-gradient(circle at center, ${color.bg} 0%, #050505 100%);">
          <div class="bg-pattern"></div>
          <div class="content-wrapper">
            <div class="topic-badge" style="color: ${color.badge}; background: rgba(${color.rgb}, 0.1); border-color: rgba(${color.rgb}, 0.3);">${cardData.topic}</div>
            <h1 class="quote-text">"${cardData.quote}"</h1>
            <p class="author-text">— ${cardData.author}</p>
            
            <button class="deep-dive-btn" onclick="deepDive('${encodeURIComponent(cardData.searchQuery)}')">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
              Mergulhar Fundo
            </button>
          </div>
          <div class="progress-bar-container"><div class="progress-bar"></div></div>
          ${isFirst ? `
          <div class="swipe-indicator">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="18 15 12 9 6 15"/></svg>
            <span>Deslize</span>
          </div>
          ` : ''}
        </div>
      `;
    }

    function deepDive(query) {
      window.location.href = `../video/?search=${query}`;
    }

    function init() {
      setupAudioStateMachine();
      appendCards(5);
      window.speechSynthesis.getVoices();
      setTimeout(initObserver, 500);

      // Configurar MediaSession para aparecer na tela de bloqueio do celular
      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: 'LivrePlay Flow',
          artist: 'Atenção Plena',
          album: 'Conhecimento Infinito',
          artwork: [
            { src: '../logo-flow.png', sizes: '512x512', type: 'image/png' }
          ]
        });

        navigator.mediaSession.setActionHandler('play', resumePlayback);
        navigator.mediaSession.setActionHandler('pause', pausePlayback);
        navigator.mediaSession.setActionHandler('nexttrack', () => {
           if(isPaused) resumePlayback();
           clearInterval(progressBarInterval);
           document.getElementById('flowContainer').scrollBy({ top: window.innerHeight, behavior: 'smooth' });
           if(document.hidden) {
              currentCardIndex++;
              if (currentCardIndex >= feedCards.length - 2) appendCards(5);
              readCard(currentCardIndex);
           }
        });
      }
    }

    // Touch and Hold handling
    const container = document.getElementById('flowContainer');
    container.addEventListener('touchstart', pausePlayback, {passive: true});
    container.addEventListener('touchend', resumePlayback, {passive: true});
    container.addEventListener('mousedown', pausePlayback, {passive: true});
    container.addEventListener('mouseup', resumePlayback, {passive: true});
    container.addEventListener('mouseleave', resumePlayback, {passive: true});

    // Visibility change handling
    document.addEventListener('visibilitychange', () => {
      // Quando a tela apaga ou o app é minimizado, queremos manter o áudio e a voz tocando
      // como um podcast. O MediaSession acima + a tag <audio> ativa previnem o iOS/Android 
      // de matar o processo na maioria dos casos.
      
      // Apenas sincronizamos se o usuário voltar para a aba e estiver fora de sincronia
      if (!document.hidden && isSoundOn) {
         // O observer tentará disparar. Se o observer se perder, já temos a garantia
         // que o background fallback (document.hidden) leu o card.
      }
    });

    document.getElementById('bgMusic').addEventListener('ended', () => {
      // Toca a próxima música da playlist quando a atual acaba
      currentTrackIndex = (currentTrackIndex + 1) % bgPlaylist.length;
      const bgMusic = document.getElementById('bgMusic');
      bgMusic.src = bgPlaylist[currentTrackIndex];
      bgMusic.play().catch(e => console.log("Erro ao tocar próxima música:", e));
    });

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
