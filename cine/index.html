<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>LivrePlay Cine - O Melhor do Cinema</title>
  
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="../logo-cine.png?v=3" type="image/png">
  <link rel="apple-touch-icon" href="../logo-cine.png?v=3">
  
  <link rel="stylesheet" href="css/style.css?v=6">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Outfit:wght@700;900&display=swap" rel="stylesheet">
  
  <!-- HLS.js para tocar m3u8 -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.12"></script>
</head>
<body>

  <!-- Navegação Superior -->
  <nav class="navbar">
    <div class="nav-left">
      <button class="back-btn" onclick="window.location.href='../'" title="Voltar para Início">
        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
      </button>
      <div class="logo">
        <img src="../logo-cine.png?v=3" width="28" height="28" alt="Logo Cine">
        <span>LivrePlay <b>Cine</b></span>
      </div>
    </div>
    <div class="nav-right">
      <button class="nav-btn" id="searchBtn" title="Buscar Filmes">
        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
      </button>
    </div>
  </nav>

  <!-- Hero Banner (Em Destaque) -->
  <header class="hero" id="heroBanner">
    <div class="hero-bg" id="heroBg">
      <img id="heroImg" src="" alt="Hero Background">
    </div>
    <div class="hero-vignette"></div>
    <div class="hero-content">
      <h1 class="hero-title" id="heroTitle">Carregando Acervo...</h1>
      <p class="hero-desc" id="heroDesc">Por favor, aguarde enquanto conectamos aos melhores filmes e séries gratuitos.</p>
      <div class="hero-buttons">
        <button class="btn-play" id="heroPlayBtn" style="display: none;">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M5 3l14 9-14 9V3z"/></svg>
          Assistir
        </button>
        <button class="btn-info" id="heroInfoBtn" style="display: none;">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
          Mais Informações
        </button>
      </div>
    </div>
  </header>

  <!-- Catálogo Netflix-style -->
  <main class="catalog" id="catalogContainer">
    <!-- Loading spinner -->
    <div class="loader" id="mainLoader">
      <div class="spinner"></div>
    </div>
    
    <!-- Linhas de categorias serão injetadas aqui -->
  </main>

  <!-- Fullscreen Player Modal -->
  <div class="player-modal" id="playerModal">
    <button class="close-player-btn" onclick="closePlayer()">
      <svg viewBox="0 0 24 24" width="32" height="32" stroke="currentColor" stroke-width="2" fill="none"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <div class="player-container">
      <div id="iframeContainer" style="width: 100%; height: 100%;"></div>
    </div>
  </div>

  <!-- Detalhes do Filme / Série Modal -->
  <div class="details-modal" id="detailsModal">
    <div class="details-overlay" onclick="closeDetails()"></div>
    <div class="details-content">
      <button class="close-details-btn" onclick="closeDetails()">
        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      <div class="details-hero">
        <img id="detailImg" src="" alt="Capa">
        <div class="details-hero-vignette"></div>
      </div>
      <div class="details-info">
        <h2 id="detailTitle">Título</h2>
        <div class="details-meta">
          <span id="detailYear" class="meta-item match">2023</span>
          <span id="detailRating" class="meta-item rating">14</span>
          <span id="detailDuration" class="meta-item">1h 45m</span>
          <span id="detailGenre" class="meta-item genre">Ação</span>
        </div>
        <p id="detailDesc" class="details-desc">Descrição do filme ou da série.</p>
        
        <p id="detailCast" class="details-cast" style="display: none;"></p>
        <p id="detailDirector" class="details-director" style="display: none;"></p>

        <button class="btn-play full-width" id="detailPlayBtn">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M5 3l14 9-14 9V3z"/></svg>
          Assistir Agora
        </button>
      </div>
    </div>
  </div>

  <script src="js/app.js?v=9"></script>
</body>
</html>
