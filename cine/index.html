  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.12"></script>

  <!-- SEO Otimização Profissional -->
  <meta name="description" content="Assista filmes e séries incríveis com o LivrePlay Cine. Catálogo completo, alta qualidade e zero anúncios. O seu novo cinema em casa 100% gratuito.">
  <meta name="keywords" content="filmes gratis, series gratis, cinema em casa, livreplay cine, assistir filmes sem anuncios, streaming gratuito">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://livreplay.com/cine/">
  
  <!-- Open Graph / Redes Sociais -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="LivrePlay Ecosystem">
  <meta property="og:url" content="https://livreplay.com/cine/">
  <meta property="og:title" content="LivrePlay Cine - O Melhor do Cinema Sem Anúncios">
  <meta property="og:description" content="Assista filmes e séries incríveis com o LivrePlay Cine. Catálogo completo, alta qualidade e zero anúncios. O seu novo cinema em casa 100% gratuito.">
  <meta property="og:image" content="https://livreplay.com/logo-cine.png">
  
  <!-- Twitter Cards -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="LivrePlay Cine - O Melhor do Cinema Sem Anúncios">
  <meta name="twitter:description" content="Assista filmes e séries incríveis com o LivrePlay Cine. Catálogo completo, alta qualidade e zero anúncios. O seu novo cinema em casa 100% gratuito.">
  <meta name="twitter:image" content="https://livreplay.com/logo-cine.png">
  </head>
<body>

  <!-- Navegação Superior -->
  <nav class="navbar">
    <div class="nav-left">
      <button class="back-btn" onclick="window.location.href='../'" title="Voltar para Início">
        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
      </button>
      <div class="logo">
        <img src="../logo-cine.png?v=3" width="28" height="28" alt="Logo Cine">
        <span>LivrePlay <b>Cine</b></span>
      </div>
    </div>
    <div class="nav-right">
      <button class="nav-btn" id="searchBtn" title="Buscar Filmes" onclick="openSearch()">
        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
      </button>
    </div>
  </nav>

  <!-- Search Modal -->
  <div id="searchModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:200; overflow-y:auto; padding-top:80px;">
    <button onclick="document.getElementById('searchModal').style.display='none'" style="position:absolute; top:max(20px, env(safe-area-inset-top)); right:20px; background:transparent; border:none; color:white; cursor:pointer;">
      <svg viewBox="0 0 24 24" width="32" height="32" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <div style="width:90%; max-width:800px; margin:0 auto;">
      <input type="text" id="searchInput" placeholder="Buscar filmes e séries..." style="width:100%; padding:15px; font-size:1.2rem; background:#333; color:white; border:none; border-radius:8px; outline:none; margin-bottom:20px;">
      <div id="searchResults" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:15px;"></div>
    </div>
  </div>
  <!-- Hero Banner (Em Destaque) -->
  <header class="hero" id="heroBanner">
    <div class="hero-bg" id="heroBg">
      <img id="heroImg" src="" alt="Hero Background">
    </div>
    <div class="hero-vignette"></div>
    <div class="hero-content">
      <h1 class="hero-title" id="heroTitle">Carregando Acervo...</h1>
      <p class="hero-desc" id="heroDesc">Por favor, aguarde enquanto conectamos aos melhores filmes e séries gratuitos.</p>
      <div class="hero-buttons">
        <button class="btn-play" id="heroPlayBtn" style="display: none;">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M5 3l14 9-14 9V3z"/></svg>
          Assistir
        </button>
      </div>
    </div>
  </header>

  <!-- Catálogo Netflix-style -->
  <main class="catalog" id="catalogContainer">
    <!-- Loading spinner -->
    <div class="loader" id="mainLoader">
      <div class="spinner"></div>
    </div>
    
    <!-- Linhas de categorias serão injetadas aqui -->
  </main>

  <!-- Fullscreen Player Modal -->
  <div class="player-modal" id="playerModal">
    <button class="close-player-btn" onclick="closePlayer()">
      <svg viewBox="0 0 24 24" width="32" height="32" stroke="currentColor" stroke-width="2" fill="none"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <div class="player-container">
      <div id="iframeContainer" style="width: 100%; height: 100%;"></div>
    </div>
  </div>

  <!-- Detalhes do Filme / Série Modal -->
  <div class="details-modal" id="detailsModal">
    <div class="details-overlay" onclick="closeDetails()"></div>
    <div class="details-content">
      <button class="close-details-btn" onclick="closeDetails()">
        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      <div class="details-hero">
        <img id="detailImg" src="" alt="Capa">
        <div class="details-hero-vignette"></div>
      </div>
      <div class="details-info">
        <h2 id="detailTitle">Título</h2>
        <div class="details-meta">
          <span id="detailYear" class="meta-item match">2023</span>
          <span id="detailRating" class="meta-item rating">14</span>
          <span id="detailDuration" class="meta-item">1h 45m</span>
          <span id="detailGenre" class="meta-item genre">Ação</span>
        </div>
        <p id="detailDesc" class="details-desc">Descrição do filme ou da série.</p>
        
        <p id="detailCast" class="details-cast" style="display: none;"></p>
        <p id="detailDirector" class="details-director" style="display: none;"></p>

        <button class="btn-play full-width" id="detailPlayBtn">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M5 3l14 9-14 9V3z"/></svg>
          Assistir Agora
        </button>
      </div>
    </div>
  </div>

  <script src="js/app.js?v=17"></script>
</body>
</html>
